name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Quality Gate & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: python -m ruff check app/ tests/

      - name: Run Ruff Format Check
        run: python -m ruff format --check app/ tests/

      - name: Run Mypy Static Type Analysis
        run: python -m mypy app/

      - name: Run Pytest Test Suite with Coverage
        run: python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Build Docker Container
        run: docker build -t profileforge:ci .
