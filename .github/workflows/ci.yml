name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy pytest-cov

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check app tests
          ruff format --check app tests

      - name: Run Mypy Static Type Analysis
        run: |
          mypy app/

      - name: Run Pytest Offline Test Suite & Contract Tests
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Build Docker Container
        run: |
          docker build -t profileforge:ci .

      - name: Multi-Layered Secret Audit
        run: |
          # Scan for leaked API tokens, cookies, or secrets
          ! git grep -nEi "password[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]|token[[:space:]]*=[[:space:]]*['\"][a-zA-Z0-9_\-]{16,}['\"]|li_at|JSESSIONID" -- app/ docs/ tests/ || (echo "Potential secret detected!" && exit 1)
